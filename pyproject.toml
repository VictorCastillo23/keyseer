[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keyseer"
version = "0.1.0"
description = "Keyframe detection via component consolidation in online Gaussian mixture background models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
video = ["opencv-python>=4.5"]
peaks = ["scipy>=1.7"]
all = ["opencv-python>=4.5", "scipy>=1.7"]

[tool.setuptools.packages.find]
include = ["keyseer*"]

[tool.pytest.ini_options]
# evaluacion/ no se distribuye ni se instala (no es parte del paquete
# keyseer) pero los tests de blobtrack/benchmark lo importan directamente
# desde el repo -- sin esto, `pytest tests/` solo funciona si el cwd ya
# esta en sys.path (p.ej. via PYTHONPATH=.).
pythonpath = ["."]
